id: script_runner_inline
enabled: true
apiVersion: v1

trigger:
  type: cron
  cron: "*/30 * * * *"

tasks:
  - id: run_inline
    type: core/script.run
    inputs:
      source:
        type: inline
        language: ts
        content: |
          const now = new Date().toISOString();
          console.log(`inline ts run at ${now}`);
      runtime: bun
      timeoutMs: 30000
