id: script_runner_git_private_ssh
enabled: true
apiVersion: v1

trigger:
  type: cron
  cron: "45 * * * *"

tasks:
  - id: checkout
    type: core/git-source.checkout
    inputs:
      repoUrl: "git@github.com:acme/private-repo.git"
      ref: "main"
      auth:
        method: ssh
        privateKey: "{{ secrets.GIT_SSH_PRIVATE_KEY }}"
        knownHosts: "{{ secrets.GIT_KNOWN_HOSTS }}"
      timeoutMs: 180000

  - id: run_private_repo_ssh
    type: core/script.run
    needs: [checkout]
    inputs:
      source:
        type: local
        path: "{{ tasks.checkout.output.workspacePath }}"
      projectMode: true
      runtime: tsx
      install:
        enabled: true
        tool: pnpm
      lifecycle:
        runPrestart: true
        runStart: true
        runPoststart: true
      timeoutMs: 300000
