id: script_runner_git_private_token
enabled: true
apiVersion: v1

trigger:
  type: cron
  cron: "15 * * * *"

tasks:
  - id: checkout
    type: core/git-source.checkout
    inputs:
      repoUrl: "https://github.com/acme/private-repo.git"
      ref: "main"
      auth:
        method: token
        token: "{{ secrets.GITHUB_TOKEN }}"
      timeoutMs: 180000

  - id: run_private_repo_token
    type: core/script.run
    needs: [checkout]
    inputs:
      source:
        type: local
        path: "{{ tasks.checkout.output.workspacePath }}"
      projectMode: true
      runtime: bun
      install:
        enabled: true
        tool: npm
      lifecycle:
        runPrestart: true
        runStart: true
        runPoststart: true
      timeoutMs: 300000
